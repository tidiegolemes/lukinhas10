name: Import Copa Base Baby video
on:
  push:
    paths:
      - ".github/workflows/import-copa-base-baby-video.yml"

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download final video
        env:
          VIDEO_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-174c-820e-88da-8b9aff9deba8/raw?se=2026-10-05T14%3A00%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=166d7a51-1e7f-5e35-ad85-c071599650f4&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T11%3A27%3A42Z&ske=2026-10-06T11%3A27%3A42Z&sks=b&skv=2026-02-06&sig=nB6bWpqMIUCPu9ot9Ox4F%2B%2BHaN6vFWTDvRaYi8U9fQM%3D'
        run: |
          curl -fL --retry 3 "$VIDEO_URL" -o lucas-copa-base-baby-2026-final-grenal.mp4
          test -s lucas-copa-base-baby-2026-final-grenal.mp4
          ls -lh lucas-copa-base-baby-2026-final-grenal.mp4
      - name: Commit video and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucas-copa-base-baby-2026-final-grenal.mp4
          git rm .github/workflows/import-copa-base-baby-video.yml
          git commit -m "Adiciona vídeo da final da Copa Base Baby 2026"
          git push
